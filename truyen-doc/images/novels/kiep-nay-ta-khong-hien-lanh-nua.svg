    <polygon points="200,560 300,560 300,380 250,350 200,380" fill="#150809"/>
    <polygon points="820,560 960,560 960,360 890,320 820,360" fill="#12070a"/>
    <rect x="450" y="420" width="20" height="140" fill="#1c0a0a"/>
    <rect x="410" y="410" width="100" height="16" fill="#1c0a0a"/>
    <line x1="460" y1="420" x2="500" y2="470" stroke="#2a0d0d" stroke-width="6"/>
  </g>
  <rect x="0" y="500" width="1024" height="200" fill="url(#fireGlow)" filter="url(#soft)"/>

  <g transform="translate(512,900)">

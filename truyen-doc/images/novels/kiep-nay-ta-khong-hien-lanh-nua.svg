  <rect x="0" y="900" width="1024" height="636" fill="#05010180" />
  <rect x="0" y="0" width="1024" height="1536" fill="url(#vignette)"/>

  <text x="512" y="1235" font-family="'Times New Roman', Georgia, serif" font-size="68" font-weight="700" fill="#f3d9b8" text-anchor="middle">Kiếp Này Ta Không</text>
  <text x="512" y="1300" font-family="'Times New Roman', Georgia, serif" font-size="68" font-weight="700" fill="#f3d9b8" text-anchor="middle">Hiền Lành Nữa</text>

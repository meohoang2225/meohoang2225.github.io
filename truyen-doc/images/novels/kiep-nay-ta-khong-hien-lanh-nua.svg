<svg width="1024" height="1536" viewBox="0 0 1024 1536" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0e10"/>
      <stop offset="50%" stop-color="#180608"/>
      <stop offset="100%" stop-color="#0a0304"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c9a0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#b5473a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b5473a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fireGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff7a2e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff7a2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a0e14"/>
      <stop offset="100%" stop-color="#1c0407"/>
    </linearGradient>
    <linearGradient id="phoenix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5a2e" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="1536" fill="url(#bg)"/>
  <circle cx="740" cy="260" r="230" fill="url(#moon)"/>
  <circle cx="740" cy="260" r="60" fill="#f7ddb8" opacity="0.8"/>

  <g opacity="0.6">

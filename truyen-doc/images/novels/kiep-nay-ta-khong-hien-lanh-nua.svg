    <path d="M0 -360 Q-110 -300 -120 -140 L-130 260 Q-130 340 -70 360 L70 360 Q130 340 130 260 L120 -140 Q110 -300 0 -360 Z" fill="url(#robe)" stroke="#0c0203" stroke-width="4"/>
    <path d="M0 -360 Q-40 -260 -30 -60 L-20 300" stroke="#7a1c1c" stroke-width="3" opacity="0.5" fill="none"/>
    <path d="M0 -360 Q40 -260 30 -60 L20 300" stroke="#7a1c1c" stroke-width="3" opacity="0.5" fill="none"/>

    <circle cx="0" cy="-410" r="52" fill="#e9c6a8"/>
    <path d="M-52 -420 Q0 -470 52 -420 Q52 -450 0 -462 Q-52 -450 -52 -420 Z" fill="#160404"/>
    <path d="M-10 -460 l6 -34 l10 6 l-4 30 Z" fill="#ffcf6b"/>
    <circle cx="18" cy="-472" r="5" fill="#ff8a3d"/>


<svg width="1024" height="1536" viewBox="0 0 1024 1536" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161824"/>
      <stop offset="55%" stop-color="#0e0f18"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22283c"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4d98a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f4d98a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f4d98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dressA" x1="0" y1="0" x2="0" y2="1">

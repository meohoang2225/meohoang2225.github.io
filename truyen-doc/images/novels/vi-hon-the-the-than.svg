  <text x="512" y="1235" font-family="'Times New Roman', Georgia, serif" font-size="80" font-weight="700" fill="#f6ecd6" text-anchor="middle">Vị Hôn Thê Thế Thân</text>
  <text x="512" y="1288" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#cbb98a" text-anchor="middle">Đóng giả chị gái, cưới nhầm một trái tim thật</text>

  <g>

  <rect x="0" y="0" width="1024" height="1536" fill="url(#vignette)"/>

  <text x="512" y="1200" font-family="'Times New Roman', Georgia, serif" font-size="54" font-weight="700" fill="#e6edff" text-anchor="middle">Mười Năm Trước Ta Chết</text>
  <text x="512" y="1258" font-family="'Times New Roman', Georgia, serif" font-size="54" font-weight="700" fill="#e6edff" text-anchor="middle">Vì Tin Sư Huynh</text>
  <text x="512" y="1302" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#a8bce6" text-anchor="middle">Trọng sinh mười năm trước, liệu có dám tin lại lần nữa?</text>

  <g>
    <rect x="222" y="1344" width="580" height="86" rx="14" fill="#0a0c1a" opacity="0.8" stroke="#5a7ad0" stroke-width="1.5"/>

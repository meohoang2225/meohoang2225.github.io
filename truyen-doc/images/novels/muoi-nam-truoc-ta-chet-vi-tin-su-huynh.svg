    <path d="M0 0 L-40 -180 Q-42 -210 -20 -220 L20 -220 Q42 -210 40 -180 L0 0 Z" fill="url(#robeDark)" stroke="#000" stroke-width="4"/>
    <circle cx="0" cy="-230" r="30" fill="#100a10"/>
    <path d="M-70 40 L110 -30 L120 -6 L-58 62 Z" fill="#c9d4e6" stroke="#5a6478" stroke-width="3"/>

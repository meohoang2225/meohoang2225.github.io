    <path d="M-44 -198 Q0 -238 44 -198 Q38 -160 0 -152 Q-38 -160 -44 -198 Z" fill="#0c0d16"/>
    <path d="M-90 -20 Q-160 -60 -170 -160" stroke="#243056" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M90 -20 Q160 -60 170 -160" stroke="#243056" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="-170" cy="-160" r="14" fill="#e9c6a8"/>
    <circle cx="170" cy="-160" r="14" fill="#e9c6a8"/>
  </g>


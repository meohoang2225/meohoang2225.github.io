    <path d="M840 20 L760 240 L820 240 L720 480"/>
  </g>

  <circle cx="512" cy="620" r="260" fill="url(#core)" filter="url(#soft)"/>

  <g transform="translate(512,760)">
    <path d="M-110 220 Q-140 40 -60 -120 Q0 -180 60 -120 Q140 40 110 220 Q100 280 0 290 Q-100 280 -110 220 Z" fill="url(#robe)" stroke="#050710" stroke-width="4"/>

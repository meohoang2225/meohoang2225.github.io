<svg width="1024" height="1536" viewBox="0 0 1024 1536" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1430"/>
      <stop offset="55%" stop-color="#0a0e22"/>
      <stop offset="100%" stop-color="#050612"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf3ff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#6ba8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6ba8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243056"/>
      <stop offset="100%" stop-color="#0c0f1e"/>
    </linearGradient>
    <linearGradient id="robeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160a10"/>
      <stop offset="100%" stop-color="#050205"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">

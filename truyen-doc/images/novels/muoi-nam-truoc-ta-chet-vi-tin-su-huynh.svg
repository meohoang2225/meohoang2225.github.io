    <polygon points="120,540 220,540 260,480 300,540 1024,540 1024,600 60,600" fill="#0a0c1c" opacity="0.7"/>
  </g>

  <g stroke="#dfeaff" stroke-width="4" opacity="0.85" fill="none">

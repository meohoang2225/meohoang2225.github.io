<svg width="1024" height="1536" viewBox="0 0 1024 1536" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="55%" stop-color="#0d1120"/>
      <stop offset="100%" stop-color="#070812"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2036"/>
      <stop offset="100%" stop-color="#05060c"/>
    </linearGradient>
    <radialGradient id="vanish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a5788" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4a5788" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#f4d98a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f4d98a" stop-opacity="0"/>

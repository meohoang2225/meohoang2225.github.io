<svg width="1024" height="1536" viewBox="0 0 1024 1536" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2f18"/>
      <stop offset="50%" stop-color="#2f1c0e"/>
      <stop offset="100%" stop-color="#180e07"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4423"/>
      <stop offset="100%" stop-color="#4a2e16"/>
    </linearGradient>
    <linearGradient id="radioBig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a4d"/>
      <stop offset="100%" stop-color="#8a531f"/>
    </linearGradient>
    <radialGradient id="dial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4a0"/>
      <stop offset="70%" stop-color="#f2a63c"/>
      <stop offset="100%" stop-color="#c9781c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdf9a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffdf9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3d2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff3d2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0500" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1024" height="1536" fill="url(#bg)"/>

  <polygon points="900,0 1024,0 1024,900 500,1536 300,1536" fill="url(#beam)"/>
  <g fill="#fff3d2" opacity="0.5">
    <circle cx="680" cy="260" r="3"/>
    <circle cx="740" cy="400" r="2.2"/>
    <circle cx="600" cy="520" r="2.6"/>
    <circle cx="800" cy="620" r="2"/>
    <circle cx="540" cy="700" r="3"/>
    <circle cx="720" cy="820" r="2.4"/>
    <circle cx="640" cy="960" r="2"/>
  </g>

  <rect x="0" y="60" width="1024" height="22" fill="#2f1c0e"/>
  <rect x="0" y="480" width="1024" height="22" fill="#2f1c0e"/>
  <rect x="60" y="82" width="20" height="398" fill="#2f1c0e"/>
  <rect x="944" y="82" width="20" height="398" fill="#2f1c0e"/>

  <g transform="translate(180,180)">
    <rect width="150" height="110" rx="10" fill="url(#shelf)" stroke="#2a1a0c" stroke-width="4"/>
    <circle cx="75" cy="55" r="34" fill="#3a2412" stroke="#c9a565" stroke-width="3"/>
    <circle cx="75" cy="55" r="4" fill="#c9a565"/>
    <rect x="18" y="18" width="24" height="18" rx="3" fill="#1e130a"/>

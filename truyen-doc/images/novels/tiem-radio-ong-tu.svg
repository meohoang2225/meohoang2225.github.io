      <line x1="-130" y1="-140" x2="-10" y2="-140"/>
      <line x1="-112" y1="-182" x2="-28" y2="-98"/>
      <line x1="-112" y1="-98" x2="-28" y2="-182"/>
    </g>
    <rect x="30" y="-210" width="140" height="34" rx="6" fill="url(#dial)"/>

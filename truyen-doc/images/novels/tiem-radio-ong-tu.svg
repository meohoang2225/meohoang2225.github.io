    <circle cx="150" cy="-120" r="16" fill="#3a2410" stroke="#c9a565" stroke-width="3"/>
    <circle cx="150" cy="-70" r="16" fill="#3a2410" stroke="#c9a565" stroke-width="3"/>
    <rect x="-190" y="10" width="380" height="30" fill="#3a2410" opacity="0.4"/>
  </g>
  <circle cx="442" cy="720" r="130" fill="url(#glow)" filter="url(#soft)"/>

  <g transform="translate(512,1170) rotate(-3)">
    <rect x="-130" y="-40" width="260" height="80" rx="10" fill="#241a10" stroke="#0e0904" stroke-width="4"/>
    <rect x="-110" y="-24" width="220" height="48" rx="6" fill="#3a2c1c"/>
    <circle cx="-55" cy="0" r="20" fill="#0e0904" stroke="#8a6a3a" stroke-width="3"/>
    <circle cx="55" cy="0" r="20" fill="#0e0904" stroke="#8a6a3a" stroke-width="3"/>
    <rect x="-30" y="-10" width="60" height="20" rx="3" fill="#0e0904"/>
  </g>

  <rect x="0" y="0" width="1024" height="1536" fill="url(#vignette)"/>

  <text x="512" y="1235" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#fbe9c8" text-anchor="middle">Tiệm Radio Ông Tư</text>
  <text x="512" y="1288" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#d7b98a" text-anchor="middle">Cuộn băng cũ và bí mật hai mươi bảy năm của gia đình</text>

  <g>
    <rect x="192" y="1338" width="640" height="86" rx="14" fill="#180d04" opacity="0.75" stroke="#c9a565" stroke-width="1.5"/>
    <text x="512" y="1390" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#f3e2bd" text-anchor="middle">Gia đình&#160;&#160;·&#160;&#160;Tâm lý&#160;&#160;·&#160;&#160;Bí ẩn</text>

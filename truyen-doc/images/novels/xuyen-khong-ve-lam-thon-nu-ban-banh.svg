<svg width="1024" height="1536" viewBox="0 0 1024 1536" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3f5"/>
      <stop offset="45%" stop-color="#fdeec2"/>
      <stop offset="100%" stop-color="#f6cf8e"/>
    </linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8672f"/>
      <stop offset="100%" stop-color="#7a4a20"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff3d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">

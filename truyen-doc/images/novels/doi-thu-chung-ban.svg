    <text x="664" y="460" font-size="120" text-anchor="middle" font-weight="700">7</text>
    <path d="M230 560 q30 -18 60 0" stroke="#eae6d2" stroke-width="3" fill="none" opacity="0.4"/>
    <path d="M700 560 q30 -18 60 0" stroke="#eae6d2" stroke-width="3" fill="none" opacity="0.4"/>

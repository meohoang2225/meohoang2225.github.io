      <stop offset="0%" stop-color="#fff2d6"/>
      <stop offset="55%" stop-color="#fbe0ae"/>
      <stop offset="100%" stop-color="#f0c988"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f5d4a"/>
      <stop offset="100%" stop-color="#204233"/>

  <g transform="translate(230,930)">
    <rect x="-90" y="-10" width="180" height="26" rx="4" fill="#1e3a8a"/>
    <rect x="-84" y="-34" width="168" height="26" rx="4" fill="#2563eb"/>
    <rect x="-78" y="-58" width="156" height="26" rx="4" fill="#3b82f6"/>
